<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0e0f;
  --panel: #11161a;
  --green: #00ff9c;
  --green-dim: #00b378;
  --amber: #ffaf00;
  --red: #ff5252;
  --text: #e6e6e6;
  --dim: #6a7280;
  --line: #1f2629;
}

body {
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,255,156,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255,175,0,0.03) 0%, transparent 50%);
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,156,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,156,0.02) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.15) 0px,
    rgba(0,0,0,0.15) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 100;
  opacity: 0.4;
}

.container {
  width: 100%;
  max-width: 1100px;
  height: 90vh;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  box-shadow:
    0 0 0 1px rgba(0,255,156,0.06),
    0 20px 80px rgba(0,0,0,0.5),
    inset 0 0 60px rgba(0,255,156,0.02);
  position: relative;
  z-index: 1;
}

.header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(180deg, rgba(0,255,156,0.03), transparent);
}

.header-left { display: flex; gap: 14px; align-items: center; }

.dots { display: flex; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
.dot.r { background: var(--red); box-shadow: 0 0 8px rgba(255,82,82,0.4); }
.dot.y { background: var(--amber); box-shadow: 0 0 8px rgba(255,175,0,0.3); }
.dot.g { background: var(--green); box-shadow: 0 0 8px rgba(0,255,156,0.4); }

.title-block {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.5px;
  color: var(--dim);
}
.title-block .accent { color: var(--green); }
.title-block .path { color: var(--text); }

.status-bar {
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.5px;
  align-items: center;
}
.status-bar .item { display: flex; gap: 6px; align-items: center; }
.live {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 12px var(--green); }
}

.reset-btn {
  background: transparent;
  color: var(--dim);
  border: 1px solid var(--line);
  padding: 4px 10px;
  font-family: inherit;
  font-size: 15px;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  border-radius: 2px;
}
.reset-btn:hover {
  color: var(--amber);
  border-color: var(--amber);
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 32px 36px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  font-size: 15px;
  line-height: 1.75;
}

.boot {
  color: var(--dim);
  font-size: 13px;
  letter-spacing: 0.4px;
  margin-bottom: 8px;
  white-space: pre-wrap;
}
.boot .ok { color: var(--green); }
.boot .warn { color: var(--amber); }
.boot .label { color: var(--text); }

.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg .prefix {
  flex-shrink: 0;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.5px;
  padding-top: 1px;
}
.msg.user .prefix { color: var(--amber); }
.msg.agent .prefix { color: var(--green); }
.msg.system .prefix { color: var(--dim); }
.msg.error .prefix { color: var(--red); }
.msg .body { flex: 1; white-space: pre-wrap; word-wrap: break-word; }
.msg.agent .body { color: var(--text); }
.msg.system .body { color: var(--dim); font-style: italic; font-size: 12px; }
.msg.error .body { color: var(--red); font-size: 12px; }

.typing {
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--dim);
  font-size: 12px;
  font-style: italic;
  padding: 2px 0;
}
.typing .prefix { color: var(--green); font-weight: 700; font-style: normal; }
.typing-dots { display: inline-flex; gap: 3px; }
.typing-dots span {
  width: 4px; height: 4px;
  background: var(--green);
  border-radius: 50%;
  animation: typingPulse 1.2s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingPulse {
  0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
  30% { opacity: 1; transform: scale(1); }
}

.input-area {
  border-top: 1px solid var(--line);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0,0,0,0.3);
}

.prompt {
  color: var(--green);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.5px;
}

input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  caret-color: var(--green);
}
input::placeholder { color: var(--dim); }

button.send {
  background: transparent;
  color: var(--green);
  border: 1px solid var(--green-dim);
  padding: 6px 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  border-radius: 2px;
}
button.send:hover:not(:disabled) {
  background: var(--green);
  color: var(--bg);
  box-shadow: 0 0 16px rgba(0,255,156,0.5);
}
button.send:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.messages::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg, .boot { animation: fadeIn 0.3s ease-out; }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="title-block"><span class="accent">~/</span><span class="path">task-agent</span> <span style="opacity:0.4">—</span> <span class="accent">llama-3.3</span></div>
    </div>
    <div class="status-bar">
      <div class="item"><span class="live"></span>CONNECTED</div>
      <button class="reset-btn" onclick="resetChat()">RESET</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="boot"><span class="ok">[OK]</span>  <span class="label">groq.client</span>         initialized
<span class="ok">[OK]</span>  <span class="label">sqlite.tasks.db</span>     mounted
<span class="ok">[OK]</span>  <span class="label">tools.registered</span>    <span style="opacity:0.7">add_task, list_tasks, complete_task, delete_task, get_urgent_tasks</span>
<span class="warn">[..]</span>  <span class="label">ready</span>               try: "what's urgent" or "add a task to finish DSA by tomorrow"</div>
  </div>

  <div class="input-area">
    <span class="prompt">›</span>
    <input
      type="text"
      id="userInput"
      placeholder="type a message..."
      autofocus
      autocomplete="off"
    />
    <button class="send" id="sendBtn" onclick="sendMessage()">SEND</button>
  </div>
</div>

<script>
const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function addMessage(text, type) {
  const msg = document.createElement('div');
  msg.className = `msg ${type}`;

  let prefix = '';
  if (type === 'user') prefix = 'user@kuldeep ›';
  else if (type === 'agent') prefix = 'agent ›';
  else if (type === 'error') prefix = '[ERR]';
  else prefix = '⚙';

  msg.innerHTML = `<div class="prefix">${prefix}</div><div class="body">${escapeHtml(text)}</div>`;
  messagesDiv.appendChild(msg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function addTyping() {
  const t = document.createElement('div');
  t.className = 'typing';
  t.id = 'typingIndicator';
  t.innerHTML = `<div class="prefix">agent ›</div><div>thinking <span class="typing-dots"><span></span><span></span><span></span></span></div>`;
  messagesDiv.appendChild(t);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  userInput.value = '';
  sendBtn.disabled = true;
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    removeTyping();

    if (data.error) {
      addMessage(data.error, 'error');
    } else {
      addMessage(data.response, 'agent');
    }
  } catch (err) {
    removeTyping();
    addMessage('Network error: ' + err.message, 'error');
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}

async function resetChat() {
  if (!confirm('Clear the chat? (Your tasks will stay in the database.)')) return;
  await fetch('/reset', { method: 'POST' });
  messagesDiv.innerHTML = `<div class="boot"><span class="ok">[OK]</span>  <span class="label">session.reset</span>       chat cleared
<span class="ok">[OK]</span>  <span class="label">tasks.db</span>            preserved
<span class="warn">[..]</span>  <span class="label">ready</span>               awaiting input</div>`;
}

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
